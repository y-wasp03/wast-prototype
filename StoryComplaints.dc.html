<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sp{--ease:cubic-bezier(.32,.72,0,1);transition:background .6s var(--ease),color .6s var(--ease)}
.sp a{color:var(--fg);text-decoration:none}
.sp a:hover{color:var(--mint)}
.wrap{max-width:1280px;margin:0 auto;padding:0 56px;box-sizing:border-box}
.mono{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.btn{transition:transform .5s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.chip{transition:transform .5s var(--ease)}
.chip:hover{transform:translateY(-1px)}
.chipbtn{transition:border-color .4s var(--ease)}
.chipbtn:hover{border-color:var(--line2)!important}
.social{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:14px;min-height:34px;border-top:1px solid var(--line);transition:padding .5s var(--ease)}
.social:hover{padding-inline-start:6px}
.nd{cursor:pointer;transition:opacity .4s var(--ease)}
.eg{transition:opacity .4s var(--ease)}
.rb{cursor:pointer;transition:opacity .35s var(--ease)}
.hit{cursor:pointer}
.moving .flow{stroke-dasharray:3 9;animation:flow 2.8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;font-size:12px;font-weight:600;line-height:1.25;text-align:center;text-shadow:0 0 2px var(--halo),0 0 4px var(--halo),0 0 6px var(--halo)}
.ol{position:absolute;white-space:nowrap;pointer-events:none;line-height:1;text-shadow:0 0 2px var(--halo),0 0 4px var(--halo)}
.ar *{letter-spacing:0!important}
.ar .mono{font-family:var(--ff);text-transform:none;font-size:12.5px}
.ar .h1{line-height:1.35!important}
.ar .back svg{transform:scaleX(-1)}
@media (max-width:760px){.wrap{padding:0 16px}.pad{padding-left:16px!important;padding-right:16px!important}.h1{font-size:30px!important}}
</style>
</helmet>
<div class="sp moving {{langCls}}" dir="{{dir}}" lang="{{lang}}" style="width: 100%; min-height: 1800px; background: var(--bg); color: var(--fg); font-family: var(--ff); display: flex; flex-direction: column; {{themeVars}}">

<header style="width: 100%; background: var(--shell); border-bottom: 1px solid var(--line)">
<nav aria-label="Main" class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; padding-bottom: 6px">
<a href="V2Main.dc.html" onClick="{{carry}}" aria-label="WAST home" style="display: flex; align-items: center"><img src="{{logo}}" alt="WAST وسط" style="height: 40px; width: auto"></a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 36px; font-size: 14px">
<a href="V2Main.dc.html" onClick="{{carry}}" style="padding: 12px 0; color: var(--fg2)">{{t.stories}}</a>
<a href="V2Main.dc.html" onClick="{{carry}}" style="padding: 12px 0; color: var(--fg2)">{{t.built}}</a>
<a href="V2Main.dc.html" onClick="{{carry}}" style="padding: 12px 0; color: var(--fg2)">{{t.about}}</a>
<button type="button" onClick="{{toggleLang}}" lang="{{otherLang}}" aria-label="{{langAria}}" style="padding: 12px 0; border: none; background: transparent; cursor: pointer; font: inherit; font-family: {{langBtnFont}}; font-size: 15px; color: var(--fg2)">{{t.langBtn}}</button>
<button type="button" class="chip" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" style="fill: none; stroke: var(--fg); stroke-width: 1.4"></circle><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" style="fill: var(--fg)"></path></svg></button>
<a href="V2Main.dc.html" onClick="{{carry}}" class="btn" style="display: flex; align-items: center; gap: 10px; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 18px; font-weight: 500">{{t.brief}}<span style="width: 32px; height: 32px; border-radius: 999px; background: var(--bg); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 9.5 9.5 2.5M4 2.5h5.5V8" style="fill: none; stroke: var(--fg); stroke-width: 1.4"></path></svg></span></a>
</div>
</nav>
</header>

<main class="pad" style="padding: 24px 36px 72px; display: flex; flex-direction: column; gap: 28px; max-width: 1368px; box-sizing: border-box; width: 100%; margin: 0 auto">
<a href="V2Main.dc.html" onClick="{{carry}}" class="back" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px 7px 10px"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>{{t.back}}</a>

<div style="display: flex; flex-direction: column; gap: 14px; max-width: 820px">
<div style="display: flex; align-items: center; gap: 8px"><img src="blob-6e041a257e796b8898b928ba5fdef55e.svg" alt="Egypt flag" style="width: 21px; height: 16px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px var(--line2)"><img src="blob-677ea3468bcf12afa2f4a65339e3b723.svg" alt="Jordan flag" style="width: 21px; height: 16px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px var(--line2)"><img src="blob-1d91fad7701626cef9d6fe49b6d3af4c.svg" alt="Morocco flag" style="width: 21px; height: 16px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px var(--line2)"><span class="mono" style="color: var(--accent); padding-inline-start: 4px">{{t.kicker}}</span></div>
<h1 class="h1" style="margin: 0; font-size: 36px; font-weight: 600; line-height: 1.12; letter-spacing: -0.025em">{{t.h1}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: var(--fg2); max-width: 760px">{{t.dek}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--mut); padding-top: 4px"><span>{{t.meta1}}</span><span>·</span><span>{{t.meta2}}</span><span>·</span><span>{{t.meta3}}</span></div>
</div>

<figure style="margin: 0; display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch">
<div style="flex: 999 1 640px; min-width: 0; position: relative; border-radius: 24px; overflow: hidden; background: var(--vizBg); border: 1px solid var(--line)">
<div dir="ltr" style="position: relative; width: 100%; aspect-ratio: 800 / 450">
<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="{{t.aria}}" style="position: absolute; inset: 0; width: 100%; height: 100%">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="6"><path d="{{l.d}}" fill="none" stroke="{{l.stroke}}" stroke-width="1" opacity="{{l.op}}"></path></sc-for>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="20"><rect x="{{c.x}}" y="{{c.y}}" width="{{c.w}}" height="{{c.h}}" fill="{{c.fill}}" opacity="{{c.op}}"></rect></sc-for>
<sc-for list="{{ribbons}}" as="r" hint-placeholder-count="20"><path class="rb" d="{{r.d}}" fill="{{r.fill}}" opacity="{{r.op}}" stroke="{{r.stroke}}" stroke-width="{{r.sw}}" onClick="{{r.pick}}" onMouseEnter="{{r.enter}}" onMouseLeave="{{r.leave}}"></path></sc-for>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="24"><rect class="hit" x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="2" fill="{{b.fill}}" opacity="{{b.op}}" onClick="{{b.pick}}" onMouseEnter="{{b.enter}}" onMouseLeave="{{b.leave}}"></rect></sc-for>
</svg>
<sc-for list="{{texts}}" as="x" hint-placeholder-count="30"><div class="ol" dir="auto" style="{{x.css}}">{{x.t}}</div></sc-for>
<sc-if value="{{hasTip}}" hint-placeholder-val="{{false}}">
<div dir="auto" style="{{tip.css}}"><div style="font-size: 12px; font-weight: 600; color: {{tip.fill}}">{{tip.name}}</div><div style="font-size: 11px; color: var(--fg2)">{{tip.line}}</div></div>
</sc-if>
</div>
<div class="mono" style="position: absolute; right: 16px; top: 14px; color: var(--fg2); background: var(--tipBg); border-radius: 999px; padding: 6px 10px; font-size: 10px">{{t.figTag}}</div>
</div>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="border-radius: 20px; border: 1px solid var(--line); background: var(--shell); padding: 20px; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><span class="mono" style="color: {{sel.fill}}">{{sel.kind}}</span><button type="button" class="chipbtn" onClick="{{clearSel}}" style="border: 1px solid var(--line2); background: transparent; color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer">{{t.clear}}</button></div>
<div style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25">{{sel.name}}</div>

</div>
</sc-if>
<sc-if value="{{noSel}}" hint-placeholder-val="{{true}}">

</sc-for>
</div>
</sc-if>
</div>
<div style="border-radius: 20px; border: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: var(--fg2)">

<div style="display: flex; flex-wrap: wrap; gap: 6px 12px; padding-top: 4px">

</div>
<div style="padding-top: 6px; border-top: 1px solid var(--line); color: var(--mut)">{{t.nNote}}</div>
</div>
</aside>
<figcaption style="flex: 1 1 100%; font-size: 13px; line-height: 1.6; color: var(--mut); max-width: 900px"><span style="color: var(--fg); font-weight: 600">{{t.capB}}</span> {{t.cap}}</figcaption>
</figure>

<section style="display: flex; flex-wrap: wrap; gap: 36px 72px; padding-top: 12px; border-top: 1px solid var(--line)">
<div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div class="mono" style="color: var(--accent)">{{t.analysisK}}</div>
<h2 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3; letter-spacing: -0.015em">{{t.analysisH}}</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 8px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4"><div style="border-radius: 14px; background: var(--shell2); padding: 14px"><div style="font-size: 22px; font-weight: 600; color: {{s.fill}}">{{s.v}}</div><div style="font-size: 12px; color: var(--mut)">{{s.k}}</div></div></sc-for>
</div>
</div>
<div style="flex: 2 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 16px; font-size: 15px; line-height: 1.75; color: var(--fg2)">
<sc-for list="{{paras}}" as="p" hint-placeholder-count="3"><p style="margin: 0">{{p.t}}</p></sc-for>
<p style="margin: 0; font-size: 13px; color: var(--mut)">{{t.method}}</p>
</div>
</section>
</main>
<footer style="margin-top: 36px; background: var(--bg); border-top: 1px solid var(--line2); padding: 36px 0 36px">
<div class="wrap" style="display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: stretch; gap: 36px">
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column">
<img src="{{logo}}" alt="WAST وسط" style="height: 84px; width: auto; max-width: 100%; align-self: flex-start">
</div>
<nav aria-label="Contact WAST" style="flex: 0 1 380px; min-width: 0; display: flex; flex-direction: column; border-bottom: 1px solid var(--line)">
<sc-for list="{{socials}}" as="so" hint-placeholder-count="5">
<a href="V2Main.dc.html" onClick="{{carry}}" class="social" aria-label="WAST on {{so.name}}">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{so.icon}}" style="fill: var(--fg)"></path></svg>
<span style="font-size: 14px; font-weight: 500">{{so.name}}</span>
<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 9.5 9.5 2.5M4 2.5h5.5V8" style="fill: none; stroke: var(--fg2); stroke-width: 1.4"></path></svg>
</a>
</sc-for>
</nav>
</div>
<div style="padding-top: 24px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; color: var(--fg2)">{{t.footer}}</div>
</div>
</footer>
</div>
</x-dc>

      const d = 'M' + xa + ' ' + a0.toFixed(1) + ' C' + mx + ' ' + a0.toFixed(1) + ' ' + mx + ' ' + b0.toFixed(1) + ' ' + xb + ' ' + b0.toFixed(1) + ' L' + xb + ' ' + (b0 + w).toFixed(1) + ' C' + mx + ' ' + (b0 + w).toFixed(1) + ' ' + mx + ' ' + (a0 + w).toFixed(1) + ' ' + xa + ' ' + (a0 + w).toFixed(1) + ' Z';
      const fo = flowOn(f);
      const big = f[0] === 'EG' && f[1] === 'JO';
      return {
        d, fill: regCol(f[0]), op: fo === null ? (big ? 0.82 : (S.dark ? 0.42 : 0.5)) : (fo ? 0.9 : 0.08), stroke: fo && focus && focus.t === 'flow' ? S.ink : 'none', sw: fo && focus && focus.t === 'flow' ? 1 : 0,
        pick: () => this.setState({ sel: sel && sel.t === 'flow' && sel.o === f[0] && sel.d === f[1] ? null : { t: 'flow', o: f[0], d: f[1] } }),
        enter: () => this.setState({ hov: { t: 'flow', o: f[0], d: f[1] } }),
        leave
      };
    });
    const ya = y0 + 12 * rh + 8;
    const ax = { stroke: S.ink, op: 0.45 };
    lines.push(Object.assign({ d: 'M58 ' + ya + ' H178' }, ax), Object.assign({ d: 'M196 ' + ya + ' H300' }, ax), Object.assign({ d: 'M500 ' + ya + ' H616' }, ax));
    const tk = { size: 11, weight: 500, fill: 'var(--fg2)' };
    [[58, '00'], [118, '12'], [178, '24']].forEach((q) => { lines.push(Object.assign({ d: 'M' + q[0] + ' ' + ya + ' v5' }, ax)); T(q[0], ya + 14, q[1], Object.assign({ anchor: 'middle' }, tk)); });
    T(118, ya + 30, 'UTC+2 / +3', Object.assign({ anchor: 'middle' }, tk));
    T(300, ya + 14, '0', Object.assign({ anchor: 'end' }, tk));
    T(196, ya + 14, fmt(Math.round(mxV / 100) * 100), tk);
    T(248, ya + 30, t.out, Object.assign({ anchor: 'middle' }, tk));
    T(500, ya + 14, '0', tk);
    T(616, ya + 14, fmt(Math.round(mxV / 100) * 100), Object.assign({ anchor: 'end' }, tk));
    T(558, ya + 30, t.in, Object.assign({ anchor: 'middle' }, tk));
    if (!focus) {
      T(660, 112, t.co, { size: 13 });
      T(660, 132, t.coSub, tk);
      lines.push({ d: 'M404 66 C470 66 560 118 652 118', stroke: S.ink, op: 0.6 });
    }
    const flowInfo = (o, d) => {
      const f = FLOWS.find((q) => q[0] === o && q[1] === d);
      const share = (f[2] / total * 100).toFixed(1) + '%';
      const desc = AR ? 'شكاوى نشرها أولاً ' + who(o) + ' في ' + nm(o) + '، ثم أعادت نشرها أو اقتبستها حسابات في ' + nm(d) + '، معظمها من ' + who(d) + '.' : 'Complaints first posted by ' + who(o) + ' in ' + nm(o) + ', then reposted or quoted by accounts in ' + nm(d) + ', mostly ' + who(d) + '.';
      return { kind: t.route, name: nm(o) + t.arrow + nm(d), fill: regCol(o), desc, stats: [{ v: fmt(f[2]), k: t.kPosts }, { v: share, k: t.kShare }, { v: String(C[o].peak).padStart(2, '0') + ':00', k: t.kPeakO }], line: fmt(f[2]) + ' ' + t.kPosts + ' · ' + share };
    };
    const cInfo = (c) => {
      const top = FLOWS.filter((f) => f[0] === c).sort((a, b) => b[2] - a[2])[0];
      const desc = AR ? 'جاءت معظم الشكاوى هنا من ' + who(c) + '. ' + (top ? 'أنشط مسار صادر منها إلى ' + nm(top[1]) + ' (' + fmt(top[2]) + ' منشور).' : 'استقبلت الشكاوى في الغالب بدلاً من أن تبدأها.') : 'Most complaints here came from ' + who(c) + '. ' + (top ? 'Its busiest outgoing route is to ' + nm(top[1]) + ' (' + fmt(top[2]) + ' posts).' : 'It mostly received complaints rather than starting them.');
      return { kind: REGIONS[C[c].reg][L], name: nm(c), fill: regCol(c), desc, stats: [{ v: fmt(out[c]), k: t.kOut }, { v: fmt(inn[c]), k: t.kIn }, { v: String(C[c].peak).padStart(2, '0') + ':00', k: t.kPeak }], line: fmt(out[c]) + ' ' + t.kOut + ' · ' + fmt(inn[c]) + ' ' + t.kIn };
    };
    let tip = null;
    if (hov) {
      const ii = hov.t === 'flow' ? flowInfo(hov.o, hov.d) : cInfo(hov.c);
      const y = hov.t === 'flow' ? y0 + oOrder.indexOf(hov.o) * rh : y0 + oOrder.indexOf(hov.c) * rh;
      const x = hov.t === 'flow' ? 400 : 320;
      tip = { name: ii.name, line: ii.line, fill: ii.fill, css: 'position: absolute; ' + pct(x, Math.max(40, y)) + '; transform: translate(-50%, -100%); background: var(--tipBg); border: 1px solid var(--line2); border-radius: 12px; padding: 8px 10px; pointer-events: none; white-space: nowrap; display: flex; flex-direction: column; gap: 2px; z-index: 2' };
    }
    const selInfo = sel ? (sel.t === 'flow' ? flowInfo(sel.o, sel.d) : cInfo(sel.c)) : { kind: '', name: '', fill: S.ink, desc: '', stats: [] };
    const topRoutes = FLOWS.slice().sort((a, b) => b[2] - a[2]).slice(0, 5).map((f) => ({ name: nm(f[0]) + t.arrow + nm(f[1]), who: who(f[0]) + t.to + who(f[1]), share: (f[2] / total * 100).toFixed(1) + '%', fill: regCol(f[0]), pick: () => this.setState({ sel: { t: 'flow', o: f[0], d: f[1] } }) }));
    return Object.assign({}, S.vals, {
      t, cells, bars, ribbons, lines, texts,
      hasTip: !!tip, tip: tip || { css: '', name: '', line: '', fill: '' },
      hasSel: !!sel, noSel: !sel, sel: selInfo, clearSel: () => this.setState({ sel: null }),
      topRoutes,
      regions: REGIONS.map((r) => ({ name: r[L], fill: S.pal[r.col] })),
      stats: STATS.map((s) => ({ v: AR && s[4] ? s[4] : s[0], k: AR ? s[2] : s[1], fill: s[3] ? S.pal[s[3]] : 'var(--fg)' })),
      paras: PARAS[L].map((p) => ({ t: p }))
    });
  }
}
</script>
